name: Probar fuentes
on:
  workflow_dispatch:
  push:
    branches: ["claude/**"]
jobs:
  probar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install requests feedparser
      - run: python scripts/probar_fuentes.py
