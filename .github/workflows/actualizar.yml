# Revisión automática: corre cada 6 horas, recolecta noticias, recalcula el semáforo,
# guarda los datos en el repositorio y publica la web en GitHub Pages.
name: Actualizar monitor

on:
  schedule:
    - cron: "17 */6 * * *"     # 00:17, 06:17, 12:17 y 18:17 UTC
  workflow_dispatch:
    inputs:
      modo:
        description: "actualizar = revisión normal · historico = volver a descargar GDELT 2023-2024 · recalcular = sin descargar"
        type: choice
        options: [actualizar, historico, recalcular]
        default: actualizar
  push:
    branches: [main]
    paths: ["config/**", "datos/*.csv", "monitor/**", "web/*.html", "web/*.js", "web/*.css"]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: monitor
  cancel-in-progress: false

jobs:
  actualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Pruebas de las reglas
        run: python -m unittest -v

      - name: Ejecutar el monitor
        env:
          # Fase 2: el secreto se configura en Settings → Secrets and variables → Actions.
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          MODO="${{ github.event.inputs.modo }}"
          if [ -z "$MODO" ]; then
            if [ "${{ github.event_name }}" = "push" ]; then MODO=recalcular; else MODO=actualizar; fi
          fi
          # La primera vez se descarga automáticamente el histórico de GDELT (tarda ~1 hora).
          if [ ! -f datos/gdelt_historico.json ] || [ "$MODO" = "historico" ]; then
            python -m monitor historico
          fi
          if [ "$MODO" != "historico" ]; then
            python -m monitor "$MODO"
          fi

      - name: Guardar los datos en el repositorio
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add datos/ web/datos.json
          if git diff --cached --quiet; then echo "Sin cambios"; exit 0; fi
          git commit -m "Datos actualizados $(date -u +'%Y-%m-%d %H:%M UTC')"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"

      - uses: actions/upload-pages-artifact@v4
        with:
          path: web

  publicar:
    needs: actualizar
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
